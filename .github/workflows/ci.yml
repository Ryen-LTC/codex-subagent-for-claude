name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  handshake:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server.py hook.py tests/smoke.py tests/handshake.py
      - run: python tests/handshake.py
